name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: SerialDebug
  APP_VERSION: '2.0.1'

jobs:
  # ===================== Linux Build =====================
  linux-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 - Qt5 system .deb + AppImage (most portable glibc)
          - runner: ubuntu-22.04
            qt_major: '5'
            qt_source: 'system'
            qt_version: ''
            label: 'Linux 22.04 (Qt5, deb+AppImage)'
            artifact_suffix: 'Linux-ubuntu2204-qt5-x86_64'
            qmake_cmd: 'qmake'
            build_deb: 'true'
            build_appimage: 'true'
            build_tarball: 'false'
          # Ubuntu 24.04 - Qt5 system .deb + tarball
          - runner: ubuntu-24.04
            qt_major: '5'
            qt_source: 'system'
            qt_version: ''
            label: 'Linux 24.04 (Qt5, deb)'
            artifact_suffix: 'Linux-ubuntu2404-qt5-x86_64'
            qmake_cmd: 'qmake'
            build_deb: 'true'
            build_appimage: 'false'
            build_tarball: 'true'
          # Ubuntu 26.04 - Qt6 aqt .deb + tarball
          - runner: ubuntu-26.04
            qt_major: '6'
            qt_source: 'aqt'
            qt_version: '6.5.3'
            label: 'Linux 26.04 (Qt6, deb)'
            artifact_suffix: 'Linux-ubuntu2604-qt6-x86_64'
            qmake_cmd: 'qmake6'
            build_deb: 'true'
            build_appimage: 'false'
            build_tarball: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies (X11 + Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Install Qt5 (system packages)
        if: matrix.qt_source == 'system'
        run: |
          sudo apt-get install -y \
            qtbase5-dev \
            qttools5-dev-tools \
            libqt5serialport5-dev \
            qtchooser

      - name: Install Qt6 (aqtinstall)
        if: matrix.qt_source == 'aqt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="${Qt6_DIR:-${QT_ROOT_DIR}}/bin:$PATH"
          fi
          ${{ matrix.qmake_cmd }} ../MySerial.pro CONFIG+=Release

      - name: Build
        run: |
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="${Qt6_DIR:-${QT_ROOT_DIR}}/bin:$PATH"
          fi
          make -j$(nproc)

      - name: Compile translations (lrelease)
        run: |
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="${Qt6_DIR:-${QT_ROOT_DIR}}/bin:$PATH"
          fi
          lrelease ../MySerial_zh_CN.ts -qm MySerial_zh_CN.qm
          ls -la MySerial_zh_CN.qm

      - name: Build .deb package
        if: matrix.build_deb == 'true'
        run: |
          cd build
          ../packaging/build-deb.sh \
            ${{ env.APP_NAME }} \
            ${{ env.APP_VERSION }} \
            amd64 \
            deploy \
            ${{ matrix.qt_major }}
          ls -lh deploy/*.deb

      - name: Build AppImage (Qt5, oldest glibc — most portable)
        if: matrix.build_appimage == 'true'
        run: |
          cd build
          ../packaging/build-appimage.sh \
            ${{ env.APP_NAME }} \
            ${{ env.APP_VERSION }}-${{ matrix.artifact_suffix }} \
            deploy
          ls -lh deploy/*.AppImage 2>/dev/null || true

      - name: Deploy Qt6 bundled libs (tarball)
        if: matrix.qt_source == 'aqt'
        run: |
          cd build
          APP_DIR="deploy/${{ env.APP_NAME }}"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/lib"

          # Copy the binary
          cp ${{ env.APP_NAME }} "$APP_DIR/"

          # Copy compiled translation
          if [ -f "MySerial_zh_CN.qm" ]; then
            mkdir -p "$APP_DIR/translations"
            cp MySerial_zh_CN.qm "$APP_DIR/translations/"
            echo "  [qm] copied MySerial_zh_CN.qm"
          fi

          QT_ROOT="${Qt6_DIR:-${QT_ROOT_DIR:-}}"
          QT_LIB_DIR="${QT_ROOT}/lib"
          QT_PLUGINS_DIR="${QT_PLUGIN_PATH:-${QT_ROOT}/plugins}"
          export LD_LIBRARY_PATH="${QT_LIB_DIR}:${LD_LIBRARY_PATH}"

          echo "Qt lib dir:      $QT_LIB_DIR"
          echo "Qt plugins dir:  $QT_PLUGINS_DIR"

          copy_lib() {
            local lib="$1"
            [ -z "$lib" ] || [ ! -f "$lib" ] && return
            local bn=$(basename "$lib")
            case "$bn" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libstdc++.so*|libgcc_s.so*|ld-linux*|libresolv.so*|libuuid.so*|libanl.so*|libcrypt.so*|libnsl.so*|libnss*|libBrokenLocale*|libSegFault*)
                echo "  [skip]  $bn"
                ;;
              *)
                cp -nL "$lib" "$APP_DIR/lib/" 2>/dev/null && echo "  [copy]  $bn"
                ;;
            esac
          }

          echo "=== Scanning binary dependencies ==="
          ldd "$APP_DIR/${{ env.APP_NAME }}" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
            copy_lib "$lib"
          done || true

          echo "=== Copying Qt plugins ==="
          mkdir -p "$APP_DIR/plugins/platforms"
          for p in libqxcb.so libqwayland-generic.so libqwayland-egl.so; do
            if [ -f "$QT_PLUGINS_DIR/platforms/$p" ]; then
              cp "$QT_PLUGINS_DIR/platforms/$p" "$APP_DIR/plugins/platforms/"
              echo "  [plugin] platforms/$p"
            fi
          done

          for dir in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
            if [ -d "$QT_PLUGINS_DIR/$dir" ]; then
              mkdir -p "$APP_DIR/plugins/$dir"
              cp "$QT_PLUGINS_DIR/$dir/"*.so "$APP_DIR/plugins/$dir/" 2>/dev/null || true
              echo "  [plugin] $dir/"
            fi
          done

          echo "=== Scanning plugin dependencies ==="
          find "$APP_DIR/plugins" -name '*.so' -print0 2>/dev/null | while IFS= read -r -d '' plugin; do
            ldd "$plugin" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
              copy_lib "$lib"
            done || true
          done || true

          echo "=== Setting RPATH ==="
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$APP_DIR/${{ env.APP_NAME }}"
          echo "RPATH set to: $(patchelf --print-rpath "$APP_DIR/${{ env.APP_NAME }}")"

          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexport LD_LIBRARY_PATH="$DIR/lib:$DIR:$LD_LIBRARY_PATH"\nif [ -n "$WAYLAND_DISPLAY" ]; then\n  export QT_QPA_PLATFORM=wayland\nelse\n  export QT_QPA_PLATFORM=xcb\nfi\nexec "$DIR/SerialDebug" "$@"\n' > "$APP_DIR/run.sh"
          chmod +x "$APP_DIR/run.sh"

          echo ""
          echo "=== Deployed files ==="
          find "$APP_DIR" -type f | sort

      - name: Deploy Qt5 bundled libs (tarball)
        if: matrix.build_tarball == 'true' && matrix.qt_source == 'system'
        run: |
          cd build
          APP_DIR="deploy/${{ env.APP_NAME }}"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/lib"

          cp ${{ env.APP_NAME }} "$APP_DIR/"

          if [ -f "MySerial_zh_CN.qm" ]; then
            mkdir -p "$APP_DIR/translations"
            cp MySerial_zh_CN.qm "$APP_DIR/translations/"
          fi

          QT_LIB_DIR=$(qmake -query QT_INSTALL_LIBS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu")
          QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/qt5/plugins")
          export LD_LIBRARY_PATH="${QT_LIB_DIR}:${LD_LIBRARY_PATH}"

          copy_lib() {
            local lib="$1"
            [ -z "$lib" ] || [ ! -f "$lib" ] && return
            local bn=$(basename "$lib")
            case "$bn" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libstdc++.so*|libgcc_s.so*|ld-linux*|libresolv.so*|libuuid.so*|libanl.so*|libcrypt.so*|libnsl.so*|libnss*|libBrokenLocale*|libSegFault*)
                echo "  [skip]  $bn"
                ;;
              *)
                cp -nL "$lib" "$APP_DIR/lib/" 2>/dev/null && echo "  [copy]  $bn"
                ;;
            esac
          }

          echo "=== Scanning binary dependencies ==="
          ldd "$APP_DIR/${{ env.APP_NAME }}" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
            copy_lib "$lib"
          done || true

          echo "=== Copying Qt plugins ==="
          mkdir -p "$APP_DIR/plugins/platforms"
          for p in libqxcb.so libqwayland-generic.so libqwayland-egl.so; do
            if [ -f "$QT_PLUGINS_DIR/platforms/$p" ]; then
              cp "$QT_PLUGINS_DIR/platforms/$p" "$APP_DIR/plugins/platforms/"
            fi
          done

          echo "=== Setting RPATH ==="
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$APP_DIR/${{ env.APP_NAME }}"

          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexport LD_LIBRARY_PATH="$DIR/lib:$DIR:$LD_LIBRARY_PATH"\nif [ -n "$WAYLAND_DISPLAY" ]; then\n  export QT_QPA_PLATFORM=wayland\nelse\n  export QT_QPA_PLATFORM=xcb\nfi\nexec "$DIR/SerialDebug" "$@"\n' > "$APP_DIR/run.sh"
          chmod +x "$APP_DIR/run.sh"

      - name: Package tarball
        if: matrix.build_tarball == 'true'
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz ${{ env.APP_NAME }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: |
            build/${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz
            build/deploy/*.deb
            build/deploy/*.AppImage

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (Qt6, x86_64)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=Release

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Compile translations (lrelease)
        shell: cmd
        run: |
          cd build
          lrelease ..\MySerial_zh_CN.ts -qm MySerial_zh_CN.qm
          dir MySerial_zh_CN.qm

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw
          if (Test-Path MySerial_zh_CN.qm) {
            New-Item -ItemType Directory -Force -Path deploy\translations | Out-Null
            Copy-Item MySerial_zh_CN.qm deploy\translations\
          }

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code (for git context)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="## Serial Debug Assistant v${{ env.APP_VERSION }}

          ### 新增功能 / New Features
          - 现代 UI 重设计，卡片式布局，暗色/亮色/Ubuntu 三套主题
          - Modern UI redesign with card-based layout, dark/light/Ubuntu themes
          - 多语言框架（中文/英文），支持菜单切换
          - Multi-language framework (Chinese/English) with menu switching
          - 模态对话框 & 居中显示
          - Modal dialogs with proper centering

          ### 打包格式 / Package Formats
          | 平台 | 包类型 |
          |------|--------|
          | Ubuntu 22.04 | .deb + AppImage（最便携 glibc） |
          | Ubuntu 24.04 | .deb |
          | Ubuntu 26.04 | .deb + tarball |
          | Windows | .zip |

          ### 安装说明 / Installation
          - **deb**: 会自动安装 Qt 依赖和 udev 规则，将用户加入 dialout 组
          - **AppImage**: 下载后 chmod +x 直接运行，无需安装
          - **Windows**: 解压后直接运行 SerialDebug.exe

          ### 完整变更 / Full Changelog
          ${{ github.event.head_commit.message || 'See commits for details' }}"

          # Find all artifacts
          FILES=$(find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' \) 2>/dev/null || true)

          if [ -n "$FILES" ]; then
            gh release create ${{ github.ref_name }} \
              --title "Release ${{ github.ref_name }}" \
              --notes "$NOTES" \
              $FILES
          else
            gh release create ${{ github.ref_name }} \
              --title "Release ${{ github.ref_name }}" \
              --notes "$NOTES"
          fi