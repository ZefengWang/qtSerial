name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: SerialDebug
  APP_VERSION: '2.0.0'

jobs:
  # ===================== Linux Build =====================
  linux-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 with Qt6 (via aqtinstall)
          - runner: ubuntu-26.04
            qt_major: '6'
            qt_source: 'aqt'
            qt_version: '6.5.3'
            label: 'Linux 26.04 (Qt6, x86_64)'
            artifact_suffix: 'Linux-ubuntu2604-qt6-x86_64'
            qmake_cmd: 'qmake6'
          # Ubuntu 24.04 with Qt5 (via system packages)
          - runner: ubuntu-24.04
            qt_major: '5'
            qt_source: 'system'
            qt_version: ''
            label: 'Linux 24.04 (Qt5, x86_64)'
            artifact_suffix: 'Linux-ubuntu2404-qt5-x86_64'
            qmake_cmd: 'qmake'
          # Ubuntu 22.04 with Qt5 (via system packages)
          - runner: ubuntu-22.04
            qt_major: '5'
            qt_source: 'system'
            qt_version: ''
            label: 'Linux 22.04 (Qt5, x86_64)'
            artifact_suffix: 'Linux-ubuntu2204-qt5-x86_64'
            qmake_cmd: 'qmake'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (X11 + Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Install Qt5 (system packages)
        if: matrix.qt_source == 'system'
        run: |
          sudo apt-get install -y \
            qtbase5-dev \
            libqt5serialport5-dev \
            qtchooser

      - name: Install Qt6 (aqtinstall)
        if: matrix.qt_source == 'aqt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="${Qt6_DIR:-${QT_ROOT_DIR}}/bin:$PATH"
          fi
          ${{ matrix.qmake_cmd }} ../MySerial.pro CONFIG+=Release

      - name: Build
        run: |
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="${Qt6_DIR:-${QT_ROOT_DIR}}/bin:$PATH"
          fi
          make -j$(nproc)

      - name: Deploy Qt libraries (X11 + Wayland + bundled libs)
        run: |
          cd build
          APP_DIR="deploy/${{ env.APP_NAME }}"
          mkdir -p "$APP_DIR/lib"

          # Copy the binary
          cp ${{ env.APP_NAME }} "$APP_DIR/"

          # --- Determine Qt directories ---
          # install-qt-action v4 sets QT_ROOT_DIR and QT_PLUGIN_PATH (not Qt6_DIR)
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            QT_ROOT="${Qt6_DIR:-${QT_ROOT_DIR:-}}"
            QT_LIB_DIR="${QT_ROOT}/lib"
            QT_PLUGINS_DIR="${QT_PLUGIN_PATH:-${QT_ROOT}/plugins}"
            export LD_LIBRARY_PATH="${QT_LIB_DIR}:${LD_LIBRARY_PATH}"
          else
            QT_LIB_DIR=$(qmake -query QT_INSTALL_LIBS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu")
            QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/qt5/plugins")
            export LD_LIBRARY_PATH="${QT_LIB_DIR}:${LD_LIBRARY_PATH}"
          fi
          echo "Qt lib dir:      $QT_LIB_DIR"
          echo "Qt plugins dir:  $QT_PLUGINS_DIR"
          echo "Plugins exists:  $([ -d "$QT_PLUGINS_DIR" ] && echo 'yes' || echo 'NO - will try alternatives')"

          # --- Collect all shared library dependencies ---
          # Function: copy a .so to lib/ unless it's a basic system library
          copy_lib() {
            local lib="$1"
            [ -z "$lib" ] || [ ! -f "$lib" ] && return
            local bn
            bn=$(basename "$lib")
            case "$bn" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libstdc++.so*|libgcc_s.so*|ld-linux*|libresolv.so*|libuuid.so*|libanl.so*|libcrypt.so*|libnsl.so*|libnss*|libBrokenLocale*|libSegFault*)
                echo "  [skip]  $bn"
                ;;
              *)
                cp -nL "$lib" "$APP_DIR/lib/" 2>/dev/null && echo "  [copy]  $bn"
                ;;
            esac
          }

          echo "=== Scanning binary dependencies ==="
          ldd "$APP_DIR/${{ env.APP_NAME }}" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
            copy_lib "$lib"
          done || true

          # --- Copy Qt platform plugins (X11 + Wayland) ---
          echo "=== Copying Qt plugins ==="
          mkdir -p "$APP_DIR/plugins/platforms"
          for p in libqxcb.so libqwayland-generic.so libqwayland-egl.so; do
            if [ -f "$QT_PLUGINS_DIR/platforms/$p" ]; then
              cp "$QT_PLUGINS_DIR/platforms/$p" "$APP_DIR/plugins/platforms/"
              echo "  [plugin] platforms/$p"
            fi
          done

          # Copy Wayland integration plugins
          for dir in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
            if [ -d "$QT_PLUGINS_DIR/$dir" ]; then
              mkdir -p "$APP_DIR/plugins/$dir"
              cp "$QT_PLUGINS_DIR/$dir/"*.so "$APP_DIR/plugins/$dir/" 2>/dev/null || true
              echo "  [plugin] $dir/"
            fi
          done

          # --- Scan plugin dependencies too (plugins may need extra libs) ---
          echo "=== Scanning plugin dependencies ==="
          find "$APP_DIR/plugins" -name '*.so' -print0 2>/dev/null | while IFS= read -r -d '' plugin; do
            ldd "$plugin" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
              copy_lib "$lib"
            done || true
          done || true

          # --- Set RPATH on the binary (force DT_RPATH so dlopen'd plugins find libs too) ---
          echo "=== Setting RPATH ==="
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$APP_DIR/${{ env.APP_NAME }}"
          echo "RPATH set to: $(patchelf --print-rpath "$APP_DIR/${{ env.APP_NAME }}")"

          # --- Create startup script ---
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexport LD_LIBRARY_PATH="$DIR/lib:$DIR:$LD_LIBRARY_PATH"\nif [ -n "$WAYLAND_DISPLAY" ]; then\n  export QT_QPA_PLATFORM=wayland\nelse\n  export QT_QPA_PLATFORM=xcb\nfi\nexec "$DIR/SerialDebug" "$@"\n' > "$APP_DIR/run.sh"
          chmod +x "$APP_DIR/run.sh"

          # --- Summary ---
          echo ""
          echo "=== Deployed files ==="
          find "$APP_DIR" -type f | sort
          echo ""
          echo "=== lib/ contents ($(ls "$APP_DIR/lib/" | wc -l) files) ==="
          ls -1 "$APP_DIR/lib/"

      - name: Package tarball
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz ${{ env.APP_NAME }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: build/${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (Qt6, x86_64)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=Release

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            */*.tar.gz
            */*.zip
          fail_on_unmatched_files: false
