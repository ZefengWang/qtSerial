name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: SerialDebug
  APP_VERSION: '2.0.0'

jobs:
  # ===================== Linux Build =====================
  linux-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 with Qt6
          - runner: ubuntu-26.04
            qt_version: '6.8.*'
            qt_host: 'linux'
            qt_arch: 'gcc_64'
            qt_modules: 'qtserialport'
            label: 'Linux 26.04 (Qt6, x86_64)'
            artifact_suffix: 'Linux-ubuntu2604-x86_64'
            qmake_cmd: 'qmake6'
            cxx_standard: 'c++17'
          # Ubuntu 24.04 with Qt5
          - runner: ubuntu-24.04
            qt_version: '5.15.*'
            qt_host: 'linux'
            qt_arch: 'gcc_64'
            qt_modules: 'qtserialport'
            label: 'Linux 24.04 (Qt5, x86_64)'
            artifact_suffix: 'Linux-ubuntu2404-x86_64'
            qmake_cmd: 'qmake'
            cxx_standard: 'c++11'
          # Ubuntu 22.04 with Qt5
          - runner: ubuntu-22.04
            qt_version: '5.15.*'
            qt_host: 'linux'
            qt_arch: 'gcc_64'
            qt_modules: 'qtserialport'
            label: 'Linux 22.04 (Qt5, x86_64)'
            artifact_suffix: 'Linux-ubuntu2204-x86_64'
            qmake_cmd: 'qmake'
            cxx_standard: 'c++11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          dir: '${{ github.workspace }}'

      - name: Install system dependencies (X11 + Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          ${{ matrix.qmake_cmd }} ../MySerial.pro CONFIG+=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Deploy Qt libraries (X11 + Wayland)
        run: |
          cd build
          mkdir -p deploy/${{ env.APP_NAME }}
          cp ${{ env.APP_NAME }} deploy/${{ env.APP_NAME }}/

          # Determine Qt plugins directory
          QT_DIR="$Qt6_DIR"
          if [ -z "$QT_DIR" ]; then
            QT_DIR="$Qt5_DIR"
          fi

          # Copy Qt platforms plugins (X11 + Wayland)
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/platforms
          # X11 platform plugin
          cp $QT_DIR/plugins/platforms/libqxcb.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          # Wayland platform plugins
          cp $QT_DIR/plugins/platforms/libqwayland-generic.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          cp $QT_DIR/plugins/platforms/libqwayland-egl.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true

          # Copy Wayland integration plugins
          for dir in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
            if [ -d "$QT_DIR/plugins/$dir" ]; then
              mkdir -p "deploy/${{ env.APP_NAME }}/plugins/$dir"
              cp $QT_DIR/plugins/$dir/*.so "deploy/${{ env.APP_NAME }}/plugins/$dir/" 2>/dev/null || true
            fi
          done

          # Create startup script with X11/Wayland auto-detection
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexport LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"\nif [ -n "$WAYLAND_DISPLAY" ]; then\n  export QT_QPA_PLATFORM=wayland\nelse\n  export QT_QPA_PLATFORM=xcb\nfi\nexec "$DIR/SerialDebug" "$@"\n' > deploy/${{ env.APP_NAME }}/run.sh
          chmod +x deploy/${{ env.APP_NAME }}/run.sh

          echo "=== Deployed files ==="
          find deploy/ -type f | head -30

      - name: Package tarball
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz ${{ env.APP_NAME }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: build/${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (Qt6, x86_64)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=Release

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            */*.tar.gz
            */*.zip
          fail_on_unmatched_files: false
