name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: serial-debug

jobs:
  # ===================== Linux Build =====================
  # 说明：.deb 直接依赖系统 Qt（在 Depends 中声明），因此用系统 Qt 编译，
  # 产物在目标发行版（含 Ubuntu 26.04，Qt6 ABI 兼容）上可直接安装运行。
  # AppImage 在最低版本（22.04）上构建，glibc 最旧，兼容性最好。
  linux-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 - 系统 Qt5：.deb + AppImage（最便携 glibc）
          - runner: ubuntu-22.04
            qt_major: '5'
            label: 'Linux 22.04 (Qt5, deb+AppImage)'
            artifact_suffix: 'Linux-ubuntu2204-qt5-x86_64'
            qmake_cmd: 'qmake'
            lrelease_cmd: 'lrelease'
            qt_base_pkgs: 'qtbase5-dev qttools5-dev-tools libqt5serialport5-dev qtchooser'
            build_deb: 'true'
            build_appimage: 'true'
            build_tarball: 'false'
          # Ubuntu 24.04 - 系统 Qt6：.deb + tarball
          - runner: ubuntu-24.04
            qt_major: '6'
            label: 'Linux 24.04 (Qt6, deb+tarball)'
            artifact_suffix: 'Linux-ubuntu2404-qt6-x86_64'
            qmake_cmd: 'qmake6'
            lrelease_cmd: '/usr/lib/qt6/bin/lrelease'
            qt_base_pkgs: 'qt6-base-dev qt6-l10n-tools'
            build_deb: 'true'
            build_appimage: 'false'
            build_tarball: 'true'
          # Ubuntu 26.04 - 系统 Qt6：.deb + tarball
          - runner: ubuntu-26.04
            qt_major: '6'
            label: 'Linux 26.04 (Qt6, deb+tarball)'
            artifact_suffix: 'Linux-ubuntu2604-qt6-x86_64'
            qmake_cmd: 'qmake6'
            lrelease_cmd: '/usr/lib/qt6/bin/lrelease'
            qt_base_pkgs: 'qt6-base-dev qt6-l10n-tools'
            build_deb: 'true'
            build_appimage: 'false'
            build_tarball: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set version from git tag
        run: |
          # 优先从 tag（如 v2.1.0）提取版本号；无 tag 时退回 git describe。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo '0.0.0')"
          fi
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=${VERSION}"

      - name: Install system dependencies (X11 + Wayland)
        run: |
          # GitHub runner 预装的 Microsoft/Azure 源偶尔返回 403，导致 apt-get update 失败，
          # 先移除这些失效源，再用官方源更新。
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Install system Qt${{ matrix.qt_major }} (apt)
        run: |
          # 上一步已清理失效源并运行过 apt-get update，这里直接安装即可。
          # serialport 开发包在两个 Ubuntu 上命名不同：
          #   - 24.04 及更早：libqt6serialport6-dev
          #   - 26.04 及更新：qt6-serialport-dev（旧名已被替换）
          # 因此先装基础包，再分别尝试两种 serialport 包名，保证任一版本都能装上。
          sudo apt-get install -y ${{ matrix.qt_base_pkgs }}
          sudo apt-get install -y qt6-serialport-dev 2>/dev/null \
            || sudo apt-get install -y libqt6serialport6-dev 2>/dev/null \
            || sudo apt-get install -y libqt5serialport5-dev
          # 确认 qmake 与 lrelease 可用
          ${{ matrix.qmake_cmd }} -v
          ls /usr/lib/qt6/bin/ 2>/dev/null | grep -E 'lrelease|lupdate' || true

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          ${{ matrix.qmake_cmd }} ../MySerial.pro CONFIG+=Release APP_VERSION_EXTERNAL="${{ env.APP_VERSION }}"

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Compile translations (lrelease)
        run: |
          cd build
          ${{ matrix.lrelease_cmd }} ../MySerial_zh_CN.ts -qm MySerial_zh_CN.qm
          ls -la MySerial_zh_CN.qm

      - name: Build .deb package
        if: matrix.build_deb == 'true'
        run: |
          cd build
          ../packaging/build-deb.sh \
            ${{ env.APP_NAME }} \
            ${{ env.APP_VERSION }} \
            amd64 \
            deploy \
            ${{ matrix.qt_major }}
          # 重命名 deb，使其包含平台后缀，避免多个平台同名覆盖
          for f in deploy/*.deb; do
            mv "$f" "deploy/${APP_NAME}_${APP_VERSION}_${{ matrix.artifact_suffix }}.deb"
          done
          ls -lh deploy/*.deb

      - name: Build AppImage (Qt5, oldest glibc — most portable)
        if: matrix.build_appimage == 'true'
        run: |
          cd build
          ../packaging/build-appimage.sh \
            ${{ env.APP_NAME }} \
            ${{ env.APP_VERSION }}-${{ matrix.artifact_suffix }} \
            deploy
          ls -lh deploy/serial-debug-*.AppImage

      - name: Deploy bundled Qt libs (tarball)
        if: matrix.build_tarball == 'true'
        run: |
          cd build
          APP_DIR="deploy/${{ env.APP_NAME }}"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/lib"

          cp ${{ env.APP_NAME }} "$APP_DIR/"

          if [ -f "MySerial_zh_CN.qm" ]; then
            mkdir -p "$APP_DIR/translations"
            cp MySerial_zh_CN.qm "$APP_DIR/translations/"
          fi

          QT_LIB_DIR=$(${{ matrix.qmake_cmd }} -query QT_INSTALL_LIBS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu")
          QT_PLUGINS_DIR=$(${{ matrix.qmake_cmd }} -query QT_INSTALL_PLUGINS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/qt5/plugins")
          export LD_LIBRARY_PATH="${QT_LIB_DIR}:${LD_LIBRARY_PATH}"

          echo "Qt lib dir:      $QT_LIB_DIR"
          echo "Qt plugins dir:  $QT_PLUGINS_DIR"

          copy_lib() {
            local lib="$1"
            [ -z "$lib" ] || [ ! -f "$lib" ] && return
            local bn=$(basename "$lib")
            case "$bn" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libstdc++.so*|libgcc_s.so*|ld-linux*|libresolv.so*|libuuid.so*|libanl.so*|libcrypt.so*|libnsl.so*|libnss*|libBrokenLocale*|libSegFault*)
                echo "  [skip]  $bn"
                ;;
              *)
                cp -nL "$lib" "$APP_DIR/lib/" 2>/dev/null && echo "  [copy]  $bn"
                ;;
            esac
          }

          echo "=== Scanning binary dependencies ==="
          ldd "$APP_DIR/${{ env.APP_NAME }}" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
            copy_lib "$lib"
          done || true

          echo "=== Copying Qt plugins ==="
          mkdir -p "$APP_DIR/plugins/platforms"
          for p in libqxcb.so libqwayland-generic.so libqwayland-egl.so; do
            if [ -f "$QT_PLUGINS_DIR/platforms/$p" ]; then
              cp "$QT_PLUGINS_DIR/platforms/$p" "$APP_DIR/plugins/platforms/"
              echo "  [plugin] platforms/$p"
            fi
          done

          echo "=== Scanning plugin dependencies ==="
          find "$APP_DIR/plugins" -name '*.so' -print0 2>/dev/null | while IFS= read -r -d '' plugin; do
            ldd "$plugin" 2>/dev/null | grep "=>" | awk '{print $3}' | sort -u | while read -r lib; do
              copy_lib "$lib"
            done || true
          done || true

          echo "=== Setting RPATH ==="
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$APP_DIR/${{ env.APP_NAME }}"
          echo "RPATH set to: $(patchelf --print-rpath "$APP_DIR/${{ env.APP_NAME }}")"

          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexport LD_LIBRARY_PATH="$DIR/lib:$DIR:$LD_LIBRARY_PATH"\nif [ -n "$WAYLAND_DISPLAY" ]; then\n  export QT_QPA_PLATFORM=wayland\nelse\n  export QT_QPA_PLATFORM=xcb\nfi\nexec "$DIR/serial-debug" "$@"\n' > "$APP_DIR/run.sh"
          chmod +x "$APP_DIR/run.sh"

          echo ""
          echo "=== Deployed files ==="
          find "$APP_DIR" -type f | sort

      - name: Package tarball
        if: matrix.build_tarball == 'true'
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz ${{ env.APP_NAME }}/

      - name: Upload .deb package
        if: matrix.build_deb == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}-deb
          path: build/deploy/*.deb

      - name: Upload AppImage
        if: matrix.build_appimage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}-AppImage
          path: build/deploy/serial-debug-*.AppImage

      - name: Upload tarball
        if: matrix.build_tarball == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}-tarball
          path: build/${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (Qt6, x86_64)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set version from git tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo '0.0.0')"
          fi
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=${VERSION}"

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=Release "APP_VERSION_EXTERNAL=${{ env.APP_VERSION }}"

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Compile translations (lrelease)
        shell: cmd
        run: |
          cd build
          lrelease ..\MySerial_zh_CN.ts -qm MySerial_zh_CN.qm
          dir MySerial_zh_CN.qm

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw
          if (Test-Path MySerial_zh_CN.qm) {
            New-Item -ItemType Directory -Force -Path deploy\translations | Out-Null
            Copy-Item MySerial_zh_CN.qm deploy\translations\
          }

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Tests (CMake + ctest + coverage) =====================
  # 测试门禁：编译核心/service/plugin/io/tests，运行单测/集成/系统测试，
  # 并输出核心层覆盖率。与构建打包解耦，任何 PR/推送都必须通过。
  tests:
    name: Tests (Qt6, ctest + coverage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies (X11 + Wayland + Qt6)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake patchelf gcov \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libx11-xcb-dev libxcb-cursor-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools
          sudo apt-get install -y qt6-serialport-dev 2>/dev/null \
            || sudo apt-get install -y libqt6serialport6-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (app + all tests)
        run: cmake --build build -j$(nproc)

      - name: Run unit / integration / system tests (ctest)
        run: |
          cd build
          QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: Core-layer line coverage (gcov)
        run: ./tests/coverage.sh build-cov

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build, tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code (for git context)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=${VERSION}"

      - name: Download all artifacts (flattened)
        uses: actions/download-artifact@v7
        with:
          pattern: 'serial-debug-*'
          merge-multiple: true
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          NOTES="## Serial Debug Assistant v${{ env.APP_VERSION }}

          ### 本版本修复 / v${{ env.APP_VERSION }} Fixes
          - 修复应用无图标（改用 PNG 图标，Linux 下正常显示）
          - Fixed missing app icon (switched to PNG, displays correctly on Linux)
          - 修复左侧串口配置侧边栏消失的问题
          - Fixed the left serial-config sidebar disappearing
          - 菜单栏新增 Settings → Advanced Settings 入口，可修改波特率等参数
          - Added Settings → Advanced Settings menu entry (baud rate, data bits, parity, etc.)
          - 切换语言即时生效，无需重启
          - Language switching now takes effect immediately
          - 可执行文件更名为小写 serial-debug
          - Executable renamed to lowercase 'serial-debug'
          - 完善 .desktop 文件（StartupWMClass/BinaryPattern），应用菜单正确显示与启动
          - Improved .desktop file (StartupWMClass/BinaryPattern) for correct menu integration

          ### 下载说明 / Download
          - **deb 包**：直接下载 .deb 文件（无需解压 zip）。
            - \`serial-debug_${{ env.APP_VERSION }}_Linux-ubuntu2204-qt5-x86_64.deb\`（Qt5）
            - \`serial-debug_${{ env.APP_VERSION }}_Linux-ubuntu2404-qt6-x86_64.deb\`（Qt6）
            - \`serial-debug_${{ env.APP_VERSION }}_Linux-ubuntu2604-qt6-x86_64.deb\`（Qt6，Ubuntu 26.04 原生）
          - **不要从 Actions 的 Artifacts 下载**——那里会把文件打成 zip。请从本 Release 的 Assets 直接下载原始 .deb。
          - **AppImage**：下载后 chmod +x 直接运行，无需安装。
          - **Windows**：解压 zip 后运行 serial-debug.exe。

          ### 安装说明 / Installation
          - **deb**: \`sudo dpkg -i serial-debug_*.deb\`，会自动安装 Qt 依赖和 udev 规则，并将当前用户加入 dialout 组。
          - **AppImage**: \`chmod +x serial-debug_*.AppImage && ./serial-debug_*.AppImage\`

          ### 完整变更 / Full Changelog
          ${{ github.event.head_commit.message || 'See commits for details' }}"

          echo "=== Creating release ==="
          # 先创建，若已存在则更新 notes
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "$NOTES" 2>/dev/null || \
          gh release edit ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "$NOTES"

      - name: Upload assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=${{ github.ref_name }}
          echo "=== 上传以下文件作为原始 Release 资源 ==="
          ls -lh artifacts/ || true
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            echo "  Uploading: $(basename "$f")"
            for i in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber 2>/dev/null; then
                echo "  Done: $(basename "$f")"
                break
              else
                echo "  Retry $i/3..."
                sleep 3
              fi
            done
          done
          echo "=== Release 资源列表 ==="
          gh release view "$TAG" --json assets -q '.assets[].name' || true
          echo "=== Release complete ==="