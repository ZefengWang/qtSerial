name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  QT_VERSION: '6.5.*'
  APP_NAME: SerialDebug
  APP_VERSION: '2.0.0'

jobs:
  # ===================== Linux Build =====================
  linux-build:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build-type: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtserialport qtwayland'
          dir: '${{ github.workspace }}'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          qmake ../MySerial.pro CONFIG+=${{ matrix.build-type }}

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Deploy (create AppDir with linuxdeployqt)
        run: |
          cd build
          # Create deployment directory
          mkdir -p deploy/${{ env.APP_NAME }}
          cp ${{ env.APP_NAME }} deploy/${{ env.APP_NAME }}/
          
          # Copy Qt plugins for X11 + Wayland
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/platforms
          cp -r $Qt6_DIR/plugins/platforms/libqxcb.so deploy/${{ env.APP_NAME }}/plugins/platforms/
          cp -r $Qt6_DIR/plugins/platforms/libqwayland-generic.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          cp -r $Qt6_DIR/plugins/platforms/libqwayland-egl.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          
          # Copy other required plugins
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/wayland-decoration-client
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/wayland-graphics-integration-client
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/wayland-shell-integration
          cp -r $Qt6_DIR/plugins/wayland-decoration-client/*.so deploy/${{ env.APP_NAME }}/plugins/wayland-decoration-client/ 2>/dev/null || true
          cp -r $Qt6_DIR/plugins/wayland-graphics-integration-client/*.so deploy/${{ env.APP_NAME }}/plugins/wayland-graphics-integration-client/ 2>/dev/null || true
          cp -r $Qt6_DIR/plugins/wayland-shell-integration/*.so deploy/${{ env.APP_NAME }}/plugins/wayland-shell-integration/ 2>/dev/null || true

      - name: Create AppImage
        run: |
          cd build
          # Download linuxdeployqt
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          cp deploy/${{ env.APP_NAME }}/${{ env.APP_NAME }} AppDir/usr/bin/
          
          # Create desktop file
          cat > AppDir/${{ env.APP_NAME }}.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Serial Debug Assistant
          Comment=Modern serial port debugging tool
          Exec=SerialDebug
          Icon=logo
          Categories=Development;Utility;
          EOF
          
          # Copy icon
          cp ../logo.ico AppDir/logo.ico 2>/dev/null || true
          
          # Run linuxdeployqt
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/${{ env.APP_NAME }}.desktop \
            -appimage \
            -no-translations \
            -qmake=$Qt6_DIR/bin/qmake \
            || true  # linuxdeployqt may fail on newer systems but still produce valid AppImage
          
          # Check if AppImage was created
          ls -la *.AppImage 2>/dev/null || echo "AppImage creation may have failed, using raw binary"

      - name: Package tarball
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-Linux-x86_64.tar.gz ${{ env.APP_NAME }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Linux-x86_64
          path: |
            build/${{ env.APP_NAME }}-Linux-x86_64.tar.gz
            build/${{ env.APP_NAME }}-x86_64.AppImage
          if-no-files-found: warn

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (x86_64)
    runs-on: windows-2022
    strategy:
      matrix:
        build-type: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=${{ matrix.build-type }}

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            */*.tar.gz
            */*.zip
            */*.AppImage
          fail_on_unmatched_files: false
