name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  QT_VERSION: '6.7.*'
  APP_NAME: SerialDebug
  APP_VERSION: '2.0.0'

jobs:
  # ===================== Linux Build =====================
  linux-build:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build-type: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Install system dependencies (X11 + Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          qmake ../MySerial.pro CONFIG+=${{ matrix.build-type }}

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Deploy Qt libraries (X11 + Wayland)
        run: |
          cd build
          mkdir -p deploy/${{ env.APP_NAME }}
          cp ${{ env.APP_NAME }} deploy/${{ env.APP_NAME }}/

          # Run windeployqt equivalent for Linux
          # Copy Qt platforms plugins (X11 + Wayland)
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/platforms
          # X11 platform plugin
          cp $Qt6_DIR/plugins/platforms/libqxcb.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          # Wayland platform plugins (included in base Qt6 on Linux)
          cp $Qt6_DIR/plugins/platforms/libqwayland-generic.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          cp $Qt6_DIR/plugins/platforms/libqwayland-egl.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true

          # Copy Wayland integration plugins
          for dir in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
            if [ -d "$Qt6_DIR/plugins/$dir" ]; then
              mkdir -p "deploy/${{ env.APP_NAME }}/plugins/$dir"
              cp $Qt6_DIR/plugins/$dir/*.so "deploy/${{ env.APP_NAME }}/plugins/$dir/" 2>/dev/null || true
            fi
          done

          # Copy Qt libraries
          linuxdeployqt_path=""
          # Try to use qt_deploy tool
          $Qt6_DIR/bin/qmake -query QT_INSTALL_LIBS | xargs -I{} cp -r {} "deploy/${{ env.APP_NAME }}/" 2>/dev/null || true

          # Create startup script
          cat > deploy/${{ env.APP_NAME }}/run.sh << 'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export QT_PLUGIN_PATH="$DIR/plugins"
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          # Support both X11 and Wayland
          if [ -n "$WAYLAND_DISPLAY" ]; then
            export QT_QPA_PLATFORM=wayland
          else
            export QT_QPA_PLATFORM=xcb
          fi
          exec "$DIR/SerialDebug" "$@"
          SCRIPT
          chmod +x deploy/${{ env.APP_NAME }}/run.sh

          echo "=== Deployed files ==="
          find deploy/ -type f | head -30

      - name: Package tarball
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-Linux-x86_64.tar.gz ${{ env.APP_NAME }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Linux-x86_64
          path: build/${{ env.APP_NAME }}-Linux-x86_64.tar.gz

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (x86_64)
    runs-on: windows-2022
    strategy:
      matrix:
        build-type: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=${{ matrix.build-type }}

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            */*.tar.gz
            */*.zip
          fail_on_unmatched_files: false
