name: Build and Release

on:
  push:
    branches: [ main, master, modern-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: SerialDebug
  APP_VERSION: '2.0.0'

jobs:
  # ===================== Linux Build =====================
  linux-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 with Qt6 (via aqtinstall)
          - runner: ubuntu-26.04
            qt_major: '6'
            qt_source: 'aqt'
            qt_version: '6.5.3'
            label: 'Linux 26.04 (Qt6, x86_64)'
            artifact_suffix: 'Linux-ubuntu2604-qt6-x86_64'
            qmake_cmd: 'qmake6'
          # Ubuntu 24.04 with Qt5 (via system packages)
          - runner: ubuntu-24.04
            qt_major: '5'
            qt_source: 'system'
            qt_version: ''
            label: 'Linux 24.04 (Qt5, x86_64)'
            artifact_suffix: 'Linux-ubuntu2404-qt5-x86_64'
            qmake_cmd: 'qmake'
          # Ubuntu 22.04 with Qt5 (via system packages)
          - runner: ubuntu-22.04
            qt_major: '5'
            qt_source: 'system'
            qt_version: ''
            label: 'Linux 22.04 (Qt5, x86_64)'
            artifact_suffix: 'Linux-ubuntu2204-qt5-x86_64'
            qmake_cmd: 'qmake'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (X11 + Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      - name: Install Qt5 (system packages)
        if: matrix.qt_source == 'system'
        run: |
          sudo apt-get install -y \
            qtbase5-dev \
            libqt5serialport5-dev \
            qtchooser

      - name: Install Qt6 (aqtinstall)
        if: matrix.qt_source == 'aqt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="$Qt6_DIR/bin:$PATH"
          fi
          ${{ matrix.qmake_cmd }} ../MySerial.pro CONFIG+=Release

      - name: Build
        run: |
          cd build
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            export PATH="$Qt6_DIR/bin:$PATH"
          fi
          make -j$(nproc)

      - name: Deploy Qt libraries (X11 + Wayland)
        run: |
          cd build
          mkdir -p deploy/${{ env.APP_NAME }}
          cp ${{ env.APP_NAME }} deploy/${{ env.APP_NAME }}/

          # Determine Qt plugins directory
          QT_PLUGINS_DIR=""
          if [ "${{ matrix.qt_source }}" = "aqt" ]; then
            # aqtinstall: Qt6_DIR is the Qt root (e.g. .../6.5.3/gcc_64), plugins are under .../plugins/
            QT_PLUGINS_DIR="$Qt6_DIR/plugins"
          else
            # System Qt5: qmake -query QT_INSTALL_PLUGINS returns the plugins dir directly
            QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/qt5/plugins")
          fi
          echo "Qt plugins dir: $QT_PLUGINS_DIR"

          # Copy Qt platforms plugins (X11 + Wayland)
          mkdir -p deploy/${{ env.APP_NAME }}/plugins/platforms
          cp $QT_PLUGINS_DIR/platforms/libqxcb.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          cp $QT_PLUGINS_DIR/platforms/libqwayland-generic.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true
          cp $QT_PLUGINS_DIR/platforms/libqwayland-egl.so deploy/${{ env.APP_NAME }}/plugins/platforms/ 2>/dev/null || true

          # Copy Wayland integration plugins
          for dir in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
            if [ -d "$QT_PLUGINS_DIR/$dir" ]; then
              mkdir -p "deploy/${{ env.APP_NAME }}/plugins/$dir"
              cp $QT_PLUGINS_DIR/$dir/*.so "deploy/${{ env.APP_NAME }}/plugins/$dir/" 2>/dev/null || true
            fi
          done

          # Create startup script with X11/Wayland auto-detection
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport QT_PLUGIN_PATH="$DIR/plugins"\nexport LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"\nif [ -n "$WAYLAND_DISPLAY" ]; then\n  export QT_QPA_PLATFORM=wayland\nelse\n  export QT_QPA_PLATFORM=xcb\nfi\nexec "$DIR/SerialDebug" "$@"\n' > deploy/${{ env.APP_NAME }}/run.sh
          chmod +x deploy/${{ env.APP_NAME }}/run.sh

          echo "=== Deployed files ==="
          find deploy/ -type f | head -30

      - name: Package tarball
        run: |
          cd build/deploy
          tar -czf ../${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz ${{ env.APP_NAME }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: build/${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz

  # ===================== Windows Build =====================
  windows-build:
    name: Windows (Qt6, x86_64)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialport'
          dir: '${{ github.workspace }}'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure project
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake.exe ..\MySerial.pro CONFIG+=Release

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      - name: Deploy (windeployqt)
        run: |
          cd build
          mkdir deploy
          cp release/${{ env.APP_NAME }}.exe deploy/
          windeployqt deploy/${{ env.APP_NAME }}.exe --no-translations --no-system-d3d-compiler --no-opengl-sw

      - name: Package zip
        run: |
          cd build
          Compress-Archive -Path deploy/* -DestinationPath ${{ env.APP_NAME }}-Windows-x86_64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x86_64
          path: build/${{ env.APP_NAME }}-Windows-x86_64.zip

  # ===================== Release (on tag) =====================
  release:
    name: Create Release
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            */*.tar.gz
            */*.zip
          fail_on_unmatched_files: false
